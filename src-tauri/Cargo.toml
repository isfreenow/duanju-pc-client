[package]
name = "hongguo-desktop-client"
version = "0.2.8"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hongguo_desktop_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "sync", "time", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "stream"] }
md-5 = "0.10"
sha2 = "0.10"
aes = "0.8"
cbc = "0.1"
cipher = "0.4"
base64 = "0.22"
flate2 = "1"
hex = "0.4"
rand = "0.8"
thiserror = "2"
url = "2"
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-deep-link = "2"
# 上游 semver 破坏：rust-ini 0.21.3 给 ParseOption 加了新字段，deep-link 2.6.2
# 在 Linux 分支用结构体字面量初始化直接编译失败；上游修复发版后移除钉住。
# 0.21.2 被作者 yank，只能钉 0.21.1。
rust-ini = "=0.21.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "process"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
