name: Release

# push 到 main 即自动定版、打 tag，并在三平台并行打包发布 GitHub Release；
# 客户端通过 updater 插件读取 latest.json 自动收到更新。
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # 定版与回写单独一个 job：四个平台的 runner 并行时不能都去改版本号。
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.commit.outputs.sha }}
      force: ${{ steps.version.outputs.force }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve next version
        id: version
        run: |
          set -euo pipefail
          declared=$(node -p "require('./package.json').version")
          # 首发时仓库还没有任何 tag，grep 无匹配会让 pipefail 直接退出，所以吃掉退出码。
          highest=$(git tag --list 'v*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1) || true
          highest=${highest:-0.0.0}
          if [ "$declared" != "$highest" ] && [ "$(printf '%s\n%s\n' "$declared" "$highest" | sort -V | tail -1)" = "$declared" ]; then
            version="$declared"
          else
            # 已发布过同号（或声明值落后）：在最高 tag 上递增补丁号，而不是从过期的声明值算。
            version=$(node -e "const [a,b,c]=process.argv[1].split('.').map(Number);console.log(\`\${a}.\${b}.\${c+1}\`)" "$highest")
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "declared: $declared · highest tag: v$highest · next: v$version"
          # 强制更新开关：读触发这次发版的那条提交正文（此刻 HEAD 还是开发者推的
          # commit，没被下面的 chore 提交覆盖）。正文写了「强制更新」就把 force 置真，
          # 由 build job 烘进 release notes，旧客户端的 UpdateBar 据此弹框锁定。
          if git log -1 --pretty=%B | grep -q "强制更新"; then
            echo "force=true" >> "$GITHUB_OUTPUT"
            echo "本次标记为强制更新（提交信息含「强制更新」）"
          else
            echo "force=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync version into manifests
        run: |
          npm pkg set version='${{ steps.version.outputs.version }}'
          node scripts/sync-version.cjs
          (cd src-tauri && cargo update --workspace)

      - name: Commit and push version bump
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          if git diff --staged --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: release v${{ steps.version.outputs.version }}"
            # GITHUB_TOKEN 推回不会再次触发本 workflow（GitHub 防递归规则）。
            git push origin HEAD:main
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    strategy:
      fail-fast: false
      # 各平台的 latest.json 要合并进同一份清单，并行写会互相覆盖，只能串行上传。
      max-parallel: 1
      matrix:
        include:
          # 本地 `tauri build` 靠配置的 targets: all；CI 逐个平台指定，避开 Linux 上
          # 会连带打 rpm（runner 不一定有 rpmbuild）的意外。
          # floating 是「浮动名副本」的固定文件名，让 releases/latest/download/<名字> 永久指向最新版。
          - platform: windows-latest
            args: "--bundles nsis,msi"
            floating: duanju-latest-windows.exe
          - platform: ubuntu-22.04
            args: "--bundles deb"
            floating: duanju-latest-linux.deb
          - platform: ubuntu-22.04
            args: "--bundles appimage"
            floating: duanju-latest-linux.AppImage
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --bundles app,dmg"
            floating: duanju-latest-macos-aarch64.dmg
          - platform: macos-latest
            args: "--target x86_64-apple-darwin --bundles app,dmg"
            floating: duanju-latest-macos-x64.dmg

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          # 检出定版提交，保证产物内嵌的版本号与 latest.json 声明的一致。
          ref: ${{ needs.plan.outputs.commit }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target (macOS x86_64)
        if: matrix.platform == 'macos-latest' && contains(matrix.args, 'x86_64-apple-darwin')
        run: rustup target add x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.plan.outputs.tag }}
          releaseName: "短剧随心看 v${{ needs.plan.outputs.version }}"
          releaseBody: "${{ needs.plan.outputs.force == 'true' && '【强制更新】此版本必须升级后方可继续使用。' || '' }}由 GitHub Actions 自动构建发布（Windows / Linux / macOS）。安装包带 updater 签名，已装的客户端可自动更新；macOS 产物未做开发者签名，首次打开需右键 → 打开。"
          releaseDraft: false
          prerelease: false
          releaseCommitish: ${{ needs.plan.outputs.commit }}
          # Windows 同时产 nsis/msi，latest.json 只有一个 windows 槽位：取 NSIS，
          # 它的静默升级不依赖系统代码页，比 msiexec 稳。
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      # 把刚产出的包复制成不带版本号的固定名再传一次：带版本号的文件名没法做永久直链，
      # 而 releases/latest/download/<固定名> 会永远指向最新版的这份副本（与 latest.json 同一机制）。
      - name: Publish floating-name copy
        shell: bash
        run: |
          set -eu
          # Windows runner 上 shell: bash 可能退化成 sh 执行（GITHUB_PATH 里 Git Bash 尚未生效），
          # 所以这里只用 POSIX 写法：不用 shopt/bash 数组，glob 展开后逐个探测取第一个命中。
          case "${{ runner.os }}" in
            Windows) pattern='src-tauri/target/release/bundle/nsis/*-setup.exe' ;;
            Linux)   pattern='src-tauri/target/release/bundle/deb/*amd64.deb' ;;
            *)       pattern='src-tauri/target/release/bundle/macos/*.dmg' ;;
          esac
          src=""
          for f in $pattern; do
            if [ -e "$f" ]; then src="$f"; break; fi
          done
          [ -n "$src" ] || { echo "::error::bundle 产物未找到，浮动名副本跳过"; exit 0; }
          cp "$src" "${{ matrix.floating }}"
          gh release upload "${{ needs.plan.outputs.tag }}" "${{ matrix.floating }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
